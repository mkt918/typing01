<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍣 Sushi Typer Factory</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="game-header-compact">
        <div class="header-left">
            <div class="energy-mini-container">
                ⚡ <span id="energyValueText">100%</span>
                <div class="energy-bar-mini-wrapper">
                    <div id="energyBar" class="energy-bar-mini overdrive" style="width: 100%;"></div>
                </div>
            </div>
        </div>
        <div class="header-center">
            <div class="timer-compact">
                ⏱️ <span id="timerValue">60秒</span>
                <div class="timer-bar-mini-wrapper">
                    <div id="timerBar" class="timer-bar-mini" style="width: 100%;"></div>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="stats-compact">
                <span>単価: <span id="charValue">10円</span></span>
            </div>
            <button id="resetButton" class="reset-button-mini">🔄</button>
        </div>
    </header>

    <!-- Main: タイピングエリア / ショップ -->
    <main class="game-main">
        <!-- タイピングモード -->
        <div id="typingMode" class="typing-mode">
            <div class="sushi-display">
                <div class="sushi-emoji">🍣</div>
                <div class="typing-stats-container">
                    <div class="money-hub">
                        <div class="money-display-main">
                            <span id="moneyValue">0円</span>
                        </div>
                        <div id="feedback" class="feedback-main"></div>
                    </div>
                    <div class="combo-area">
                        <div id="comboDisplay" class="combo-display">0 Combo</div>
                    </div>
                </div>
            </div>

            <!-- 難易度選択 -->
            <div class="difficulty-selector">
                <button id="difficultyLevel1" class="difficulty-button active" data-difficulty="easy">
                    レベル1<br>(報酬1倍)
                </button>
                <button id="difficultyLevel2" class="difficulty-button" data-difficulty="normal">
                    レベル2<br>(報酬2倍)
                </button>
                <button id="difficultyLevel3" class="difficulty-button" data-difficulty="hard">
                    レベル3<br>(報酬3倍)
                </button>
                <button id="difficultyLevel4" class="difficulty-button" data-difficulty="level4">
                    レベル4<br>(報酬5倍)
                </button>
                <button id="difficultyLevel5" class="difficulty-button" data-difficulty="level5">
                    レベル5<br>(報酬10倍)
                </button>
            </div>
            <div id="difficultyMessage" class="difficulty-message"></div>

            <div class="typing-area">
                <div id="targetWordJapanese" class="target-word-japanese">準備中...</div>
                <div id="targetWord" class="target-word">準備中...</div>
                <div id="userInput" class="user-input"></div>
            </div>

            <button id="startButton" class="start-button">タイピング開始！</button>
        </div>

        <!-- ショップモード -->
        <div id="shopMode" class="shop-mode hidden">
            <h2 class="shop-title">🛒 ショップ</h2>

            <div class="shop-header-row">
                <div class="shop-money-display">
                    <span class="shop-money-label">現在の所持金</span>
                    <span class="shop-money-value" id="shopMoneyValue">0円</span>
                </div>
                <button id="backToTypingUpper" class="back-button-shop-inline">タイピングに戻る</button>
            </div>

            <!-- アップグレードセクション -->
            <div class="shop-section">
                <h3 class="section-title">⬆️ アップグレード</h3>
                <div class="shop-description">
                    アップグレードでタイピングがもっと稼げる！
                </div>
                <div id="upgradeList" class="upgrade-list"></div>
            </div>

            <!-- テーマセクション -->
            <div class="shop-section">
                <h3 class="section-title">🎨 背景テーマ</h3>
                <div class="shop-description">
                    プレミアムなテーマでタイピング画面をカスタマイズ！
                </div>
                <div id="themeList" class="theme-list"></div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="game-footer">
        <button id="openShop" class="shop-button">🛒 ショップを開く</button>
    </footer>

    <!-- パーティクルコンテナ -->
    <div id="particleContainer" class="particle-container"></div>

    <script src="words.js"></script>
    <script src="script.js"></script>
</body>

</html>
