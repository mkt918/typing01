<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍣 Sushi Typer Factory</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header: 所持金・タイマー -->
    <header class="game-header">
        <div class="money-display">
            <div class="money-label">💰 所持金</div>
            <div id="moneyValue" class="money-value">0円</div>
        </div>
        <div class="timer-container">
            <div class="timer-label">⏱️ 残り時間</div>
            <div id="timerValue" class="timer-value">60秒</div>
            <div class="timer-bar-wrapper">
                <div id="timerBar" class="timer-bar" style="width: 100%;"></div>
            </div>
        </div>
        <div class="energy-container">
            <div class="energy-label">⚡ 工場電力</div>
            <div id="energyValueText" class="energy-value-text">100%</div>
            <div class="energy-bar-wrapper">
                <div id="energyBar" class="energy-bar overdrive" style="width: 100%;"></div>
            </div>
        </div>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">今回獲得:</span>
                <span id="sessionEarnings" class="stat-value">0円</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">文字単価:</span>
                <span id="charValue" class="stat-value">10円/文字</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">毎分生産:</span>
                <span id="productionValue" class="stat-value">0円/分</span>
            </div>
        </div>
        <div class="header-buttons">
            <button id="resetButton" class="reset-button">🔄 リセット</button>
        </div>
    </header>

    <!-- Main: タイピングエリア / ショップ -->
    <main class="game-main">
        <!-- タイピングモード -->
        <div id="typingMode" class="typing-mode">
            <div class="sushi-display">
                <div class="sushi-emoji">🍣</div>
            </div>

            <!-- 難易度選択 -->
            <div class="difficulty-selector">
                <button id="difficultyEasy" class="difficulty-button active" data-difficulty="easy">
                    簡単 (×1.0)
                </button>
                <button id="difficultyNormal" class="difficulty-button" data-difficulty="normal">
                    普通 (×1.5)
                </button>
                <button id="difficultyHard" class="difficulty-button" data-difficulty="hard">
                    難しい (×2.0)
                </button>
            </div>

            <div class="typing-area">
                <div id="targetWordJapanese" class="target-word-japanese">準備中...</div>
                <div id="targetWord" class="target-word">準備中...</div>
                <div id="userInput" class="user-input"></div>
                <div id="feedback" class="feedback"></div>
            </div>

            <div class="typing-stats">
                <div class="stat-box">
                    <div class="stat-number" id="correctChars">0</div>
                    <div class="stat-label-small">正解文字数</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalWords">0</div>
                    <div class="stat-label-small">完成単語</div>
                </div>
            </div>

            <button id="startButton" class="start-button">タイピング開始！</button>
        </div>

        <!-- ショップモード -->
        <div id="shopMode" class="shop-mode hidden">
            <h2 class="shop-title">🛒 ショップ</h2>

            <!-- アップグレードセクション -->
            <div class="shop-section">
                <h3 class="section-title">⬆️ アップグレード</h3>
                <div class="shop-description">
                    アップグレードでタイピングがもっと稼げる！
                </div>
                <div id="upgradeList" class="upgrade-list"></div>
            </div>

            <!-- 設備セクション -->
            <div class="shop-section">
                <h3 class="section-title">🏭 自動生産設備</h3>
                <div class="shop-description">
                    設備を購入すると、次回から自動的にお金が増えます！
                </div>
                <div id="shopList" class="shop-list"></div>
            </div>

            <button id="backToTyping" class="back-button">タイピングに戻る</button>
        </div>
    </main>

    <!-- Footer: インベントリ -->
    <footer class="game-footer">
        <div class="inventory-section">
            <h3 class="inventory-title">📦 所持設備</h3>
            <div id="inventoryList" class="inventory-list">
                <div class="inventory-empty">まだ設備がありません</div>
            </div>
        </div>
        <button id="openShop" class="shop-button">🛒 ショップを開く</button>
    </footer>

    <!-- パーティクルコンテナ -->
    <div id="particleContainer" class="particle-container"></div>

    <script src="script.js"></script>
</body>

</html>
